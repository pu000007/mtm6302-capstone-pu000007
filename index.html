<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Pictures of the Day</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="header-logo">
                <h1><a href="index.html">Astronomy Pictures <br>of the Day</a></h1>
            </div>
            <div class="header-favourite">
                <h2><a href="gallery.html">❤️My Favourite Pictures</a></h2>
            </div>
        </header>

        <main>
            <div class="date-container">
                <p>Choose the non-future day of the <br>astronomy picture you want to see</p>
                <div class="choose-date">
                    <input type="number" id="day" placeholder="15">
                    <input type="number" id="month" placeholder="05">
                    <input type="number" id="year" placeholder="2019">
                </div>
                <button id="confirm"><a href="glowing rose demo.html">Confirm</a></button>
            </div>

            <div class="image-example">
                <img id="example-picture" src="https://apod.nasa.gov/apod/image/2203/TitanGlint_cassini_960.jpg" 
                alt="an example of astronomy picture">
                <div class="info-example">
                    <p>Title: Titan Seas Reflect Sunlight</p>
                    <p>Date: 2022-03-27</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
